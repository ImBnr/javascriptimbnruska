<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        var a_svia_isa=parseFloat(prompt("napisz liczbe"));
        if(a_svia_isa%2==0)
        {
            document.write("liczba " + a_svia_isa + " jest parzysta");
        }
        else if(a_svia_isa%2!=0)
        {
            document.write("liczba " + a_svia_isa + " nie jest parzystą")
        }
    </script>
</body>
</html>
