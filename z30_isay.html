<html>

<head>
    <script type="text/javascript">
        var pudelko = {
            kolor: 'bialy',
            rozmiar: '12x12x5',
            material: 'karton',
            Pudelko_wyswietl_isayeu: function () {
                document.write(this.kolor + ' ' + this.rozmiar + ' ' + this.material)
            }
        }
        pudelko.pokaz(); 
    </script>
</head>

<body>
    <br>
    Programowanie obiektowe. <br>
    Obiekt to pudełko<br>
    Pola: kolor <br> rozmiar <br> material<br>
    metoda: Pudelko_wyswietl_isayeu<br>
</body>

</html>
