<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style-type: square;
        }
        li,
        p {
            font-weight: bold;
        }
        .centriruem{
            margin: 1.5%
        }
    </style>
</head>

<body>
    <div class="centriruem">
    <h3>1. Rodzaje „filozofii” programowania.</h3>
    <ul>
        <li>imperatywne</li>
        <li>strukturalne</li>
        <li>proceduralne</li>
        <li>obiektowe (OOP)</li>
        <li>funkcyjne</li>
        <li>deklaratywne</li>
        <li>logiczne</li>
    </ul>
    <h3>2. Opisz paradygmat programowania strukturalnego. Założenia programowania strukturalnego.</h3>
    <p>Program dzielony na bloki i podprogramy. Brak goto, jasny przepływ sterowania. <br> Założenia: sekwencja,
        instrukcje warunkowe, pętle, podział na funkcje.</p>
    <h3>3. Programowanie obiektowe: definicja (angielski skrót, obiekty, stan, zachowanie, końcowa konkluzja czym jest
        programowanie obiektowe).</h3>
    <p>OOP (Object-Oriented Programming) opiera się na obiektach, które mają stan (dane) i zachowanie (metody).
        <br>Program to zbiór współpracujących obiektów modelujących rzeczywistość.</p>
    <h3>4. Dlaczego stosujemy programowanie obiektowe?</h3>
    <ul>
        <li>lepsza organizacja kodu</li>

        <li>łatwiejsze utrzymanie i rozwój</li>

        <li>ponowne użycie kodu</li>

        <li>czytelność przy dużych projektach</li>
    </ul>
    <h3>5. Omów następujące pojęcia ( w krótkiej formie)</h3>
    <ul>
        <li>Klasa – szablon obiektów</li>
        <li>Obiekt - instancja klasy</li>
        <li>Właściwość - dane obiektu</li>
        <li>Metoda - funkcja obiektu</li>
        <li>Konstruktor - metoda inicjalizująca obiekt</li>
        <li>Dziedziczenie - przejmowanie cech innej klasy</li>
        <li>Hermetyzacja - ukrywanie szczegółów implementacji</li>
        <li>Polimorfizm - różne zachowanie tej samej metody w różnych klasach</li>
    </ul>
    </div>
