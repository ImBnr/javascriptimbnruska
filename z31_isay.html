<html>

<head>
    <script type="text/javascript">
        var pudelko = {
            kolor: 'bialy',
            rozmiar: '12x12x5',
            material: 'karton',
            Pudelko_wyswietl_isayeu: function () {
                document.write(this.kolor + ' ' + this.rozmiar)
            }
        }
        pudelko.Pudelko_wyswietl_isayeu();
        pudelko.wyglad = 'piekny';
        pudelko.wypisz = function () { alert('Wyglad: ' + this.wyglad) }
        pudelko.wypisz(); 
    </script>
</head>

<body>
    <br>
    Programowanie obiektowe. <br>
    Obiekt to pudelko<br>
    Pola:<br>
    kolor<br>
    rozmiar<br>
    material<br>
    metoda: Pudelko_wyswietl_isayeu<br>
    nowe pole to wygląd <br>
    nowa metoda to wypisz();<br>
</body>

</html>
