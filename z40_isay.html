<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <title>Isayeu Z40</title>
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var x = prompt("podaj argument x=", "");
            var x_isa = parseFloat(x);
            document.write("Wykonał Isayeu Sviatoslau <br>")
            document.write("czytany argument x=" + x_isa + "<br>");
            function f_isa(x_isa) {
                if (x_isa >= 1) { return 1; }
                if ((x_isa => -2) && (x_isa < 1)) { return x_isa * x_isa; }
                if (x_isa < -2) { return 4; }
            }
            document.write("f=" + f_isa(x_isa) + "<br>");
        </script>
    </div>
</body>

</html>
