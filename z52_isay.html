<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <title> Przykład użycia pętli </title>
    <script language="JavaScript">
        for (var i_isa = 1; i_isa <= 10; i_isa++) {
            for (var k_isa = 1; k_isa <= i_isa; k_isa++) {
                document.write("&nbsp");
            }
            document.write(i_isa + "<br>");
        }
    </script>
</head>

<body>
</body>

</html>
