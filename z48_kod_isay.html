<!DOCTYPE html>

<head>
    <title>Isayeu </title>
    <meta charset="utf-8">
</head>

<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            do {
                var liczba1 = prompt("wysokość=", "");
                var h_isa = parseFloat(liczba1);
            }
            while (h_isa <= 0);
            do {
                var liczba1 = prompt("podstawę=", "");
                var a_isa = parseFloat(liczba1);
            }
            while (!(a_isa > 0));
            var Pole = a_isa * h_isa / 2;
            document.write("Pole=" + Pole.toFixed(2) + " cm^2" + "<br>"); 
        </script>
    </div>
</body>
