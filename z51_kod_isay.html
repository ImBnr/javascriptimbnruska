<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="color:red;font-size: 50px;">
        <script>
            do {
                silnia_koniec = parseFloat(prompt("z czego silnia", ""));
            }
            while(silnia_koniec<0);
            if (silnia_koniec==0) {silnia_isa=1;}
            else 
            {
                var silnia_isa=1;
                for(i=1;i<=silnia_koniec;i++)
            {
                silnia_isa=silnia_isa*i;
            }
            }
            document.write(silnia_koniec+"!="+silnia_isa)
        </script>
    </div>
</body>
