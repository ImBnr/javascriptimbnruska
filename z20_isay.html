<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 20</title>
    <script>
        function AB_isay(A, B) {
            return Math.sqrt(Math.pow(B.x - A.x, 2) + Math.pow(B.y - A.y, 2));
        }

        function BC_isay(B, C) {
            return Math.sqrt(Math.pow(C.x - B.x, 2) + Math.pow(C.y - B.y, 2));
        }

        function AC_isay(A, C) {
            return Math.sqrt(Math.pow(C.x - A.x, 2) + Math.pow(C.y - A.y, 2));
        }

        function obliczBoki() {
            let xa_isay = parseFloat(prompt("Podaj współrzędną X punktu A:"));
            let ya_isay = parseFloat(prompt("Podaj współrzędną Y punktu A:"));
            let xb_isay = parseFloat(prompt("Podaj współrzędną X punktu B:"));
            let yb_isay = parseFloat(prompt("Podaj współrzędną Y punktu B:"));
            let xc_isay = parseFloat(prompt("Podaj współrzędną X punktu C:"));
            let yc_isay = parseFloat(prompt("Podaj współrzędną Y punktu C:"));

            let A = {x: xa_isay, y: ya_isay};
            let B = {x: xb_isay, y: yb_isay};
            let C = {x: xc_isay, y: yc_isay};

            let AB = AB_isay(A, B);
            let BC = BC_isay(B, C);
            let AC = AC_isay(A, C);

            document.getElementById("wynik").innerHTML =
                "<b>Długości boków trójkąta:</b><br>" +
                "AB = " + AB.toFixed(2) + "<br>" +
                "BC = " + BC.toFixed(2) + "<br>" +
                "AC = " + AC.toFixed(2);
        }
    </script>
</head>
<body>
    <h1>Zadanie 20 - Obliczanie długości boków trójkąta</h1>
    <button onclick="obliczBoki()">Wczytaj punkty i oblicz długości boków</button>
    <p id="wynik"></p>
</body>
</html>
