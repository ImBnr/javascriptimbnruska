<!DOCTYPE html>

<head>
    <title> proste obliczenia</title>
    <meta charset="utf-8">
</head>

<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var liczba1 = prompt("liczba1=", "");
            var liczba2 = prompt("liczba2=", "");
            var suma;
            var x1_isa = parseFloat(liczba1);
            var x2_isa = parseFloat(liczba2);
            document.write("x1= " + x1_isa + "&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp" + " x2= " + x2_isa + "<br>");
            
            var y1_isa=3*Math.pow(x1_isa, 5/7);
            document.write("y1="+y1_isa.toFixed(2)+"<br>");

            var rad_x1_isa=(x1_isa*Math.PI)/180;
            var y2_isa=2*Math.cos(rad_x1_isa)+3*Math.sin(rad_x1_isa);
            document.write("y2="+y2_isa.toFixed(2)+"<br>");

            akuku_isa=Math.pow(x1_isa,5)+2*Math.pow(x2_isa,4);
            y3_isa=Math.pow(akuku_isa,1/3)*Math.abs(x1_isa-x2_isa);
            document.write("y3="+y3_isa.toFixed(2)+"<br>");
        </script>
    </div>
</body>
