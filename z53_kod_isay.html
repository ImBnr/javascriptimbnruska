<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <title> Przykład użycia pętli </title>
    <script language="JavaScript">
        ile_razy_powtór_isa = parseFloat(prompt("Ile razy ma powtórzyć?"))
        inicjaly_isa = prompt("Napisz swoje inicjały")
        for (var i_isa = 1; i_isa <= ile_razy_powtór_isa; i_isa++) {
            for (var k_isa = 1; k_isa <= i_isa; k_isa++) {
                document.write("&nbsp");
            }
            document.write(inicjaly_isa + "<br>");
        }
    </script>
</head>
